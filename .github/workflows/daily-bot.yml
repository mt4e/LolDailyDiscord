name: Daily LoL Summary Bot

on:
  schedule:
    # Runs daily at 09:00 UTC (adjust to your timezone if needed)
    # Format: minute hour day month day-of-week
    - cron: '00 09 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env file
        run: |
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env
          echo "RIOT_API_KEY=${{ secrets.RIOT_API_KEY }}" >> .env
          echo "DISCORD_CHANNEL_ID=${{ secrets.DISCORD_CHANNEL_ID }}" >> .env
          echo "RIOT_PLATFORM=${{ secrets.RIOT_PLATFORM }}" >> .env
          echo "RIOT_REGION=${{ secrets.RIOT_REGION }}" >> .env
          echo "TIMEZONE=${{ secrets.TIMEZONE }}" >> .env
          echo "RUN_HOUR=${{ secrets.RUN_HOUR }}" >> .env
          echo "RUN_MINUTE=${{ secrets.RUN_MINUTE }}" >> .env
          echo "PLAYERS_JSON=${{ secrets.PLAYERS_JSON }}" >> .env
      
      - name: Run bot (execute once and exit)
        run: timeout 60 python bot.py || true
