# Daily LoL Summary Bot
#
# Triggered by an EXTERNAL cron service via the GitHub workflow_dispatch API:
#   POST https://api.github.com/repos/mt4e/LolDailyDiscord/actions/workflows/daily-bot.yml/dispatches
#   Authorization: Bearer <fine-grained PAT with Actions: read/write on this repo>
#   {"ref": "main"}
# (GitHub's own "schedule" cron is deliberately NOT used: it never fired reliably on this repo
# after the workflow file was renamed - see GITHUB_ACTIONS_SETUP.md. 2026-09-11.)
on:
  workflow_dispatch: # External cron service triggers this daily at 08:20 UTC

# The bot keeps its memory (LP snapshots + last-check times) in lol_daily.sqlite3.
# After each run this workflow commits that file back to the repository so the
# LP diff stays consistent between runs. GITHUB_TOKEN therefore needs write access.
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Config is passed as environment variables (not a .env file): the bot's
      # load_dotenv() never overrides variables that already exist in the environment.
      - name: Run bot (execute once and exit)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          RIOT_PLATFORM: ${{ vars.RIOT_PLATFORM }}
          RIOT_REGION: ${{ vars.RIOT_REGION }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          PLAYERS_JSON: ${{ secrets.PLAYERS_JSON }}
          IMMEDIATE_RUN: 'true'
        run: timeout 120 python bot.py || true

      - name: Persist bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          if [ -f lol_daily.sqlite3 ]; then
            git add lol_daily.sqlite3
          fi
          if git diff --cached --quiet; then
            echo "No state change recorded"
          else
            git commit -m "chore: persist daily bot state"
            git push || { git pull --rebase && git push; }
          fi
