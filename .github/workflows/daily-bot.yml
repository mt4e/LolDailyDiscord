name: Daily LoL Summary Bot

# Updated: removed RUN_HOUR and RUN_MINUTE - scheduling managed by cron
on:
  schedule:
    # Runs daily at 08:00 UTC = 09:00 Europe/Paris (Europe/Paris is UTC+1 standard time, UTC+2 in summer)
    # Format: minute hour day month day-of-week
    - cron: '00 08 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env file
        run: |
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env
          echo "RIOT_API_KEY=${{ secrets.RIOT_API_KEY }}" >> .env
          echo "DISCORD_CHANNEL_ID=${{ vars.DISCORD_CHANNEL_ID }}" >> .env
          echo "RIOT_PLATFORM=${{ vars.RIOT_PLATFORM }}" >> .env
          echo "RIOT_REGION=${{ vars.RIOT_REGION }}" >> .env
          echo "TIMEZONE=${{ vars.TIMEZONE }}" >> .env
          printf 'PLAYERS_JSON=%s\n' '${{ secrets.PLAYERS_JSON }}' >> .env
          echo "IMMEDIATE_RUN=true" >> .env
      
      - name: Run bot (execute once and exit)
        run: timeout 120 python bot.py || true
