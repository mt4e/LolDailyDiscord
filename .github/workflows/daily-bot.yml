name: Daily LoL Summary Bot

on:
  schedule:
    # 08:20 UTC = 09:20 Europe/Paris in winter (CET, UTC+1) / 10:20 in summer (CEST, UTC+2).
    # Avoiding the top of the hour reduces the queue delays GitHub applies to scheduled runs.
    # 2026-09-11 fix: GitHub silently drops a schedule when the workflow file has been
    # renamed/deleted in the past (see GITHUB_ACTIONS_SETUP.md troubleshooting). Pushing ANY
    # change to this file forces GitHub to re-register the cron below. Do not remove this comment.
    # TEMP - TEST CRON (12:15 UTC, ~13 min from now) to verify the schedule fires after the
    # re-registration fix. Restore to '20 8 * * *' once confirmed.
    - cron: '15 12 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

# The bot keeps its memory (LP snapshots + last-check times) in lol_daily.sqlite3.
# After each run this workflow commits that file back to the repository so the
# LP diff stays consistent between runs. GITHUB_TOKEN therefore needs write access.
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Config is passed as environment variables (not a .env file): the bot's
      # load_dotenv() never overrides variables that already exist in the environment.
      - name: Run bot (execute once and exit)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          RIOT_PLATFORM: ${{ vars.RIOT_PLATFORM }}
          RIOT_REGION: ${{ vars.RIOT_REGION }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          PLAYERS_JSON: ${{ secrets.PLAYERS_JSON }}
          IMMEDIATE_RUN: 'true'
        run: timeout 120 python bot.py || true

      - name: Persist bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          if [ -f lol_daily.sqlite3 ]; then
            git add lol_daily.sqlite3
          fi
          if git diff --cached --quiet; then
            echo "No state change recorded"
          else
            git commit -m "chore: persist daily bot state"
            git push || { git pull --rebase && git push; }
          fi
