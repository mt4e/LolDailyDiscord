# TEMPORARY verification workflow (2026-09-11) - DELETE once the daily cron is confirmed to fire.
# Why it exists: GitHub never (re)registered the cron on the renamed daily-bot.yml (0 scheduled
# runs in history). A BRAND-NEW workflow file name gets a fresh, reliable schedule registration.
# NOTE: while this file exists it is the ONLY owner of a schedule cron; if it ran the bot at the
# same time as daily-bot.yml, Discord would get duplicate posts. Runs once, then revert.
name: Daily LoL Summary Bot (schedule test)

on:
  schedule:
    # Verification cron: 13:20 UTC on 2026-09-11 (to be replaced by 08:20 UTC schedule afterwards).
    - cron: '20 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (execute once and exit)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          RIOT_PLATFORM: ${{ vars.RIOT_PLATFORM }}
          RIOT_REGION: ${{ vars.RIOT_REGION }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          PLAYERS_JSON: ${{ secrets.PLAYERS_JSON }}
          IMMEDIATE_RUN: 'true'
        run: timeout 120 python bot.py || true

      - name: Persist bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          if [ -f lol_daily.sqlite3 ]; then
            git add lol_daily.sqlite3
          fi
          if git diff --cached --quiet; then
            echo "No state change recorded"
          else
            git commit -m "chore: persist daily bot state"
            git push || { git pull --rebase && git push; }
          fi